name: pwpush-tenant-platform
metadata:
  name: pwpush-tenant-platform
services:
  - name: tenant-control-plane
    image: ghcr.io/your-org/tenant-control-plane:latest
    ingress:
      external: true
      targetPort: 8080
    environment:
      - name: APP_ENV
        value: production
      - name: TENANT_SSO_PROVIDER
        value: entra-id
      - name: TENANT_ENFORCE_MFA
        value: "true"
      - name: TENANT_AUDIT_LOGS
        value: "true"
      - name: TENANT_ISOLATION_MODE
        value: per-tenant-instance
      - name: PWPUSH_API_BASE_URL
        value: https://pwpush.example.com
    secrets:
      - name: PWPUSH_API_TOKEN
        value: "${PWPUSH_API_TOKEN}"
      - name: AZURE_TENANT_ID
        value: "${AZURE_TENANT_ID}"
      - name: AZURE_CLIENT_ID
        value: "${AZURE_CLIENT_ID}"
      - name: AZURE_CLIENT_SECRET
        value: "${AZURE_CLIENT_SECRET}"
