version: '3.9'

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "production"
      DATABASE_URL: "postgresql://app_user:change-me@postgres:5432/tenant_control_plane"
      PWPUSH_API_BASE_URL: "http://pwpush:5100"
      PWPUSH_API_TOKEN: "replace-me"
      TENANT_SECRET_SALT: "replace-me"
      ALLOWED_ORIGINS: "https://admin.example.com"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenant_control_plane
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
